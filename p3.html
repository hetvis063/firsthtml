<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            color: #333;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            padding: 10px 25px;
            margin-top: 15px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #eee;
            border-radius: 5px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Marks Calculator</h1>

        <input type="text" id="name" placeholder="Enter Student Name">

        <input type="number" id="sub1" placeholder="Enter Subject 1 Marks">

        <input type="number" id="sub2" placeholder="Enter Subject 2 Marks">

        <input type="number" id="sub3" placeholder="Enter Subject 3 Marks">

        <input type="number" id="sub4" placeholder="Enter Subject 4 Marks">

        <input type="number" id="sub5" placeholder="Enter Subject 5 Marks">

        <button onclick="calculateMarks()">Calculate Result</button>

        <div id="result"></div>

    </div>


    <script>

        function calculateMarks() {

            // Get values from input fields
            let name = document.getElementById("name").value;

            let sub1 = Number(document.getElementById("sub1").value);
            let sub2 = Number(document.getElementById("sub2").value);
            let sub3 = Number(document.getElementById("sub3").value);
            let sub4 = Number(document.getElementById("sub4").value);
            let sub5 = Number(document.getElementById("sub5").value);

            // Calculate total
            let total = sub1 + sub2 + sub3 + sub4 + sub5;

            // Calculate percentage
            let percentage = total / 5;

            // Find grade
            let grade;

            if (percentage >= 90) {
                grade = "A+";
            }
            else if (percentage >= 80) {
                grade = "A";
            }
            else if (percentage >= 70) {
                grade = "B";
            }
            else if (percentage >= 60) {
                grade = "C";
            }
            else if (percentage >= 50) {
                grade = "D";
            }
            else {
                grade = "F";
            }

            // Check pass or fail
            let status;

            if (percentage >= 40) {
                status = "PASS";
            }
            else {
                status = "FAIL";
            }

            // Display result
            document.getElementById("result").innerHTML =
                "<b>Student Name:</b> " + name + "<br>" +
                "<b>Total Marks:</b> " + total + " / 500<br>" +
                "<b>Percentage:</b> " + percentage.toFixed(2) + "%<br>" +
                "<b>Grade:</b> " + grade + "<br>" +
                "<b>Status:</b> " + status;
        }

    </script>

</body>
</html>
